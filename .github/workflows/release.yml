name: Build Street Dash RPK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vela toolkit
        run: npm install --no-audit --no-fund
      # All game sprites are committed directly to the repo. Do not
      # regenerate old placeholder sprites over the updated character art.
      - name: Validate sources
        run: npm run check && npm test
      - name: Build Xiaomi Vela RPK
        run: npm run build
      - name: Check built package
        run: |
          find dist -name '*.rpk' -print
          test -n "$(find dist -name '*.rpk' -type f -print -quit)"
          mkdir -p out
          find dist -type f -name '*.rpk' -exec cp {} out/Street-Dash-Band10Pro.rpk \;
          test -s out/Street-Dash-Band10Pro.rpk
          file out/Street-Dash-Band10Pro.rpk
      - name: Verify character artwork in the RPK
        run: python scripts/verify_rpk.py out/Street-Dash-Band10Pro.rpk
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: Street-Dash-Band10Pro-RPK
          path: out/Street-Dash-Band10Pro.rpk
          if-no-files-found: error
      - name: Publish downloadable GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.${{ github.run_number }}"
          gh release create "$TAG" out/Street-Dash-Band10Pro.rpk \
            --title "Street Dash $TAG" \
            --notes "New versioned V3 character art with RPK asset integrity checks and EXIT GAME for Xiaomi Smart Band 10 Pro on China Vela firmware. Download the .rpk and install it through AstroBox. Experimental: test on your own device." \
            --latest
